<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0D1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Double Vie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<title>Double Vie</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout : carnet de vie au format téléphone — en-tête avec portrait encadré, frise chronologique des années, quatre jauges, barre d’onglets avec le bouton Âge au centre. Surfaces blanches sans bordure, ombres très douces, icônes au trait dans des pastilles teintées. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#EDF1EF; --surface-3:#E3E9E6; --ink:#111915; --ink-2:#2B3631; --muted:#68766F; --line:rgba(17,25,21,.08); --line-2:rgba(17,25,21,.14);
  --p1:#0F7A67; --p1-2:#0A5E4F; --p2:#C0437B; --p2-2:#972F5F; --on-pc:#FFFFFF; --gold:#8A5E0E; --gold-bg:#FBF1DE;
  --good:#2F8A4C; --warn:#C98A12; --bad:#C7402F; --scrim:rgba(12,18,15,.42);
  --wall:#2A3530; --floor:#E8EEEA;
  --sh-1:0 1px 2px rgba(16,24,20,.05),0 2px 6px rgba(16,24,20,.05);
  --sh-2:0 18px 40px -18px rgba(16,24,20,.35);
  --h1-bg:#DFF1EC; --h1-fg:#0E7462; --h2-bg:#E3ECFA; --h2-fg:#2E5DAE; --h3-bg:#ECE6FA; --h3-fg:#6544B2; --h4-bg:#FAE5EE; --h4-fg:#AE376B;
  --h5-bg:#FAEEDA; --h5-fg:#93600E; --h6-bg:#E4F2E0; --h6-fg:#397A2B; --h7-bg:#E9EDF0; --h7-fg:#4A5862;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pc:var(--p1); --pc-2:var(--p1-2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1210; --surface:#161D1A; --surface-2:#1D2622; --surface-3:#26302B; --ink:#E8EFEB; --ink-2:#C9D4CE; --muted:#93A29A; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --p1:#3CC2A6; --p1-2:#2A9C84; --p2:#F07DB0; --p2-2:#CF5A90; --on-pc:#06140F; --gold:#E7B652; --gold-bg:#2C2414;
    --good:#5DC27B; --warn:#E6B444; --bad:#F2725F; --scrim:rgba(0,0,0,.6); --wall:#46534C; --floor:#1C2521;
    --sh-1:0 0 0 1px rgba(255,255,255,.05); --sh-2:0 20px 50px -20px rgba(0,0,0,.8);
    --h1-bg:rgba(60,194,166,.14); --h1-fg:#62D3BA; --h2-bg:rgba(110,155,240,.15); --h2-fg:#93B4F3; --h3-bg:rgba(160,130,240,.15); --h3-fg:#B9A2F2; --h4-bg:rgba(240,125,176,.14); --h4-fg:#F29BC2;
    --h5-bg:rgba(231,182,82,.14); --h5-fg:#E9C26F; --h6-bg:rgba(110,200,100,.13); --h6-fg:#8FD27F; --h7-bg:rgba(200,215,225,.09); --h7-fg:#B4C1CA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1210; --surface:#161D1A; --surface-2:#1D2622; --surface-3:#26302B; --ink:#E8EFEB; --ink-2:#C9D4CE; --muted:#93A29A; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --p1:#3CC2A6; --p1-2:#2A9C84; --p2:#F07DB0; --p2-2:#CF5A90; --on-pc:#06140F; --gold:#E7B652; --gold-bg:#2C2414;
  --good:#5DC27B; --warn:#E6B444; --bad:#F2725F; --scrim:rgba(0,0,0,.6); --wall:#46534C; --floor:#1C2521;
  --sh-1:0 0 0 1px rgba(255,255,255,.05); --sh-2:0 20px 50px -20px rgba(0,0,0,.8);
  --h1-bg:rgba(60,194,166,.14); --h1-fg:#62D3BA; --h2-bg:rgba(110,155,240,.15); --h2-fg:#93B4F3; --h3-bg:rgba(160,130,240,.15); --h3-fg:#B9A2F2; --h4-bg:rgba(240,125,176,.14); --h4-fg:#F29BC2;
  --h5-bg:rgba(231,182,82,.14); --h5-fg:#E9C26F; --h6-bg:rgba(110,200,100,.13); --h6-fg:#8FD27F; --h7-bg:rgba(200,215,225,.09); --h7-fg:#B4C1CA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.ico{width:20px;height:20px;display:block;flex:none}

/* ---------- Écran de jeu ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand span{color:var(--p2)}
.players{display:flex;gap:6px;margin-left:auto;min-width:0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:transparent;font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:0;font-weight:600}
.chip .cav{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--c)}
.chip.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.chip:not(.on) .cav{box-shadow:0 0 0 2px var(--line-2);filter:saturate(.6)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.icon-btn{border:0;background:var(--surface);box-shadow:var(--sh-1);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;flex:none;color:var(--ink-2)}
.players:empty + .icon-btn{margin-left:auto}
.idcard{display:flex;gap:14px;align-items:center;padding-block:10px 12px}
.avatar{width:68px;height:68px;border-radius:50%;border:0;padding:3px;background:conic-gradient(from 200deg,var(--pc),var(--pc-2),var(--pc));flex:none;display:block;box-shadow:var(--sh-1)}
.avatar>svg,.avatar>.avw{width:100%;height:100%;border-radius:50%;display:block;overflow:hidden;box-shadow:0 0 0 2px var(--bg)}
.who{min-width:0;flex:1}
.who h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.08;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.who p{margin:3px 0 0;color:var(--muted);font-size:13px}
.bdgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px!important}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.bdg .ico{width:12px;height:12px}
.bdg.pt{background:var(--h4-bg);color:var(--h4-fg)}
.cash{display:grid;justify-items:end;gap:1px;padding:7px 10px;border-radius:12px;background:var(--gold-bg);color:var(--gold);font-weight:800;font-size:15px;white-space:nowrap}
.cash small{font-weight:700;color:var(--gold);opacity:.75;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.log{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border-radius:20px;box-shadow:var(--sh-1);padding:8px 0;overscroll-behavior:contain}
.yr{display:grid;grid-template-columns:54px 1fr;gap:0 10px;padding:10px 16px 10px 10px;position:relative}
.yr+.yr::before{content:"";position:absolute;left:64px;right:16px;top:0;height:1px;background:var(--line)}
.ya{justify-self:center;align-self:start;display:grid;justify-items:center;min-width:42px;padding:4px 6px;border-radius:12px;background:var(--surface-2);font-family:var(--display);font-weight:800;font-size:17px;line-height:1;color:var(--pc)}
.ya small{font-family:var(--body);font-weight:700;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.yr:last-child .ya{background:var(--pc);color:var(--on-pc)}
.yr:last-child .ya small{color:var(--on-pc);opacity:.8}
.yl{min-width:0;display:grid;gap:5px;padding-top:2px}
.yl p{margin:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:flex-start;color:var(--ink-2)}
.yl p .li{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;margin-top:-1px}
.yl p .li .ico{width:14px;height:14px}
.yl p .le{flex:none;width:22px;text-align:center;font-size:14px;margin-top:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;padding-block:14px 12px}
.stat{display:grid;grid-template-columns:1fr auto;gap:5px 8px;font-size:12.5px;align-items:center}
.stat.m{grid-template-columns:auto 1fr auto;gap:5px 7px}
.stat .si{color:var(--muted)}
.stat .si .ico{width:15px;height:15px}
.stat b{font-weight:700;color:var(--ink-2)}
.stat .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;font-weight:700}
.bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--good);transition:width .45s ease}
.bar.w i{background:var(--warn)} .bar.b i{background:var(--bad)}
.mini{display:block;width:52px;height:5px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.mini i{display:block;height:100%;background:var(--good)} .mini.w i{background:var(--warn)} .mini.b i{background:var(--bad)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:2px;padding-block:6px max(10px,env(safe-area-inset-bottom,0px));background:var(--bg)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:7px 0;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab:hover:not(:disabled){color:var(--ink);background:var(--surface)}
.tab:disabled{opacity:.4;cursor:default}
.age{justify-self:center;width:66px;height:66px;margin-top:-26px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(160deg,var(--pc),var(--pc-2));color:var(--on-pc);font-family:var(--display);font-weight:800;font-size:12.5px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 10px 22px -10px var(--pc);transition:transform .12s}
.age b{font-size:26px;line-height:.85}
.age:active:not(:disabled){transform:scale(.94)}
.age:disabled{opacity:.45;cursor:default;box-shadow:none}

/* ---------- Avatars ---------- */
.avw{display:block;width:100%;height:100%}
.avsvg,.avw svg{display:block;width:100%;height:100%}
.avw.dead{filter:grayscale(1) contrast(.9);opacity:.8}
.pet{display:grid;place-items:center;width:100%;height:100%;font-size:22px;background:var(--h5-bg);border-radius:50%}
.sheethead{display:flex;gap:16px;align-items:center;margin-top:14px}
.sheethead>.ph-av,.sheethead>.avw,.sheethead>.pet{width:84px;height:84px;flex:none;border-radius:50%;overflow:hidden;box-shadow:var(--sh-1)}
.sheethead svg{width:100%;height:100%;display:block}
.sheethead .pet{font-size:38px}
.sheethead>div{min-width:0}

/* ---------- Avis de décès ---------- */
.obit{margin:10px 12px 12px;padding:20px 16px;border-radius:18px;background:var(--surface-2);text-align:center}
.obav{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;overflow:hidden}
.obit .ok{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.obit h2{font-family:var(--display);font-weight:800;font-size:26px;margin:4px 0 2px;letter-spacing:-.02em;text-wrap:balance}
.obit p{margin:0;color:var(--muted)}
.ribbon{display:flex;gap:12px;align-items:center;text-align:left;margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--sh-1)}
.ribbon>span{font-size:28px}
.ribbon small{display:block;color:var(--muted);font-size:12.5px}
.obit dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;text-align:left}
.obit dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.obit dd{margin:0;font-weight:700}
.obit .list{text-align:left}

/* ---------- Panneaux ---------- */
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
.panel{position:relative;background:var(--bg);width:100%;max-width:560px;height:91%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--sh-2)}
.panel::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:9px;background:var(--line-2)}
@keyframes up{from{transform:translateY(32px)}to{transform:none}}
.ph{display:flex;align-items:center;gap:8px;padding-block:20px 10px}
.ph h2{margin:0;font-family:var(--display);font-weight:800;font-size:23px;flex:1;letter-spacing:-.02em;min-width:0;overflow-wrap:anywhere}
.pb{flex:1;overflow-y:auto;padding-block:2px 32px;overscroll-behavior:contain}
.sec{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden;margin-top:12px}
.sec + .list{margin-top:0}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 14px;min-height:58px}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.row:hover:not(:disabled){background:var(--surface-2)}
.row:disabled{cursor:default}
.row:disabled .rt,.row:disabled .ic{opacity:.45}
.ic{flex:none;width:36px;height:36px;border-radius:11px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:18px;overflow:hidden}
.ic.h1{background:var(--h1-bg);color:var(--h1-fg)} .ic.h2{background:var(--h2-bg);color:var(--h2-fg)} .ic.h3{background:var(--h3-bg);color:var(--h3-fg)} .ic.h4{background:var(--h4-bg);color:var(--h4-fg)}
.ic.h5{background:var(--h5-bg);color:var(--h5-fg)} .ic.h6{background:var(--h6-bg);color:var(--h6-fg)} .ic.h7{background:var(--h7-bg);color:var(--h7-fg)}
.li.h1{background:var(--h1-bg);color:var(--h1-fg)} .li.h2{background:var(--h2-bg);color:var(--h2-fg)} .li.h3{background:var(--h3-bg);color:var(--h3-fg)} .li.h4{background:var(--h4-bg);color:var(--h4-fg)}
.li.h5{background:var(--h5-bg);color:var(--h5-fg)} .li.h6{background:var(--h6-bg);color:var(--h6-fg)} .li.h7{background:var(--h7-bg);color:var(--h7-fg)}
.ic.av{border-radius:50%;background:transparent}
.ic.av svg{width:100%;height:100%}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:700;overflow-wrap:anywhere}
.rt small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere;margin-top:1px}
.rr{flex:none;font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:4px}
.rr.chev{color:var(--line-2);font-size:20px;font-weight:400}
.row.danger .rt b{color:var(--bad)}
.row.danger .ic{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.spark{display:block;max-width:100%}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--sh-1);padding:16px;margin-top:12px;display:grid;gap:9px;min-width:0}
.card .ck,.sheethead .ck{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card .cv,.sheethead .cv{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.12;letter-spacing:-.015em;overflow-wrap:anywhere}
.card .cs,.sheethead .cs{color:var(--muted);font-size:13.5px}
.kv{grid-template-columns:1fr 1fr}
.kv small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.kv b{font-size:16px;color:var(--gold);font-weight:800}
.note{color:var(--muted);font-size:13.5px;margin:12px 4px 0;max-width:62ch}
.sl{display:grid;gap:5px;font-size:13px;font-weight:700}
.sl span{display:flex;justify-content:space-between}
.sl output{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--pc)}
label.f{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
input:not([type=range]):not([type=checkbox]),select{background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:10px 11px;font-size:15px;width:100%;min-width:0;color:var(--ink)}
input:not([type=range]):not([type=checkbox]):focus,select:focus{border-color:var(--pc);outline:0;background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700}
.chk small{color:var(--muted);font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--c,var(--pc))}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.rb{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--sh-1);padding:14px;display:grid;gap:4px;min-width:0}
.rb>span{font-size:26px}
.rb b{font-size:13.5px}
.rb small{color:var(--muted);font-size:11.5px;line-height:1.3}
.rb em{position:absolute;top:10px;right:12px;font-style:normal;font-size:12px;color:var(--gold);font-weight:800}
.rb.off{opacity:.45}
.rb.off>span{filter:grayscale(1)}

/* ---------- Éditeur d’apparence ---------- */
.led{display:grid;gap:4px}
.led-top{display:flex;gap:16px;align-items:center;margin-top:12px}
.led-prev{width:116px;height:116px;border-radius:50%;overflow:hidden;flex:none;box-shadow:var(--sh-1)}
.led-prev svg{width:100%;height:100%;display:block}
.led-top .led-acts{display:grid;gap:8px;min-width:0}
.led-sec{background:var(--surface);border-radius:16px;box-shadow:var(--sh-1);padding:12px 14px;margin-top:10px}
.led-sec h4{margin:0 0 9px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.opts button{border:0;background:var(--surface-2);border-radius:14px;padding:6px 4px 7px;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-2);min-width:0}
.opts button .mav{width:48px;height:48px;border-radius:50%;overflow:hidden}
.opts button .mav svg{width:100%;height:100%;display:block}
.opts button.on{background:var(--surface);box-shadow:0 0 0 2px var(--pc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:var(--surface-2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.chips button.on{background:var(--pc);color:var(--on-pc)}
details.led-wrap{margin-top:2px}
details.led-wrap>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:var(--surface-2);font-weight:700;font-size:13.5px}
details.led-wrap>summary::-webkit-details-marker{display:none}
details.led-wrap>summary .sav{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none}
details.led-wrap>summary .sav svg{width:100%;height:100%;display:block}
details.led-wrap>summary small{display:block;color:var(--muted);font-weight:600;font-size:12px}

/* ---------- Modale ---------- */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:40;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));backdrop-filter:blur(2px)}
.mbox{background:var(--surface);border-radius:24px;max-width:430px;width:100%;padding:22px 20px 18px;max-height:88vh;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh-2);animation:pop .2s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@keyframes pop{from{transform:scale(.96) translateY(6px)}to{transform:none}}
.mhead{display:flex;align-items:center;gap:12px}
#micon{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;line-height:1;background:color-mix(in srgb,var(--pc) 13%,transparent);color:var(--pc)}
#micon .ico{width:22px;height:22px}
.mbox h3{font-family:var(--display);font-weight:800;font-size:14px;margin:0;color:var(--muted);letter-spacing:.01em}
.mtext{margin:0;font-size:17px;line-height:1.42;font-weight:600;text-wrap:pretty;overflow-y:auto;min-height:0;color:var(--ink)}
.mch{display:flex;flex-direction:column;gap:8px;overflow-y:auto;margin-top:2px;flex:none;max-height:46vh}
.mch:empty{display:none}
.btn{border:0;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-weight:700;text-align:left;font-size:15px;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:linear-gradient(160deg,var(--pc),var(--pc-2));color:var(--on-pc);text-align:center}
.btn.danger{color:var(--bad)}
.cand{display:flex;gap:14px;align-items:center}
.cavatar{width:76px;height:76px;border-radius:50%;overflow:hidden;flex:none;box-shadow:var(--sh-1)}
.cavatar svg{width:100%;height:100%;display:block}
.cand2{display:grid;gap:9px;margin-top:12px;font-size:13px}

/* ---------- Mini-jeux ---------- */
.gsub{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.gmsg{margin:10px 0 0;font-family:var(--display);font-weight:800;font-size:18px;text-align:center}
.gbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.table{display:grid;gap:12px}
.hand small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.pc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:64px;margin-right:6px;border-radius:9px;background:#fff;color:#16211C;border:1px solid #d5ddd8;font-weight:800;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pc small{font-size:16px;line-height:1}
.pc.red{color:#C23E2C}
.pc.back{background:linear-gradient(160deg,#2F6F8F,#1F4E66);color:#fff;font-size:30px}
.slots{display:flex;justify-content:center;gap:10px;margin:8px 0}
.slots span{width:72px;height:80px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:40px}
.race{display:grid;gap:7px}
.lane{display:grid;gap:3px;font-size:13px}
.lane.mine .hn{color:var(--pc);font-weight:800}
.lane small{color:var(--muted)}
.track{position:relative;display:block;height:24px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.track i{position:absolute;top:0;font-style:normal;font-size:18px;transform:scaleX(-1);transition:left .07s linear}
.scratch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{height:56px;border-radius:12px;border:0;background:linear-gradient(135deg,#C9B26A,#E8D89C);color:#3b2f0b;font-weight:800;font-size:15px}
.cell.open{background:var(--surface-2);color:var(--ink)}
.maze{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;width:100%;max-width:330px;margin:0 auto;border-radius:10px;overflow:hidden;aspect-ratio:1}
.maze span{display:grid;place-items:center;font-size:clamp(12px,4vw,20px);line-height:1}
.maze .w{background:var(--wall)} .maze .f{background:var(--floor)}
.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:6px;margin-top:12px}
.pad .btn{text-align:center;padding:10px 0;font-size:20px}
.pad .btn.pri{grid-column:1/-1;font-size:15px}
.alarm{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:700}
.alarm i{width:26px;height:8px;border-radius:9px;background:var(--surface-3)}
.alarm i.on{background:var(--bad)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.room{border:0;background:var(--surface-2);border-radius:12px;padding:10px 6px;font-weight:700;font-size:13.5px;display:grid;justify-items:center;gap:2px}
.room span{font-size:24px}
.room.done{opacity:.4}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;width:max-content;max-width:min(440px,calc(100% - 32px));font-size:14px;font-weight:600;z-index:60;box-shadow:var(--sh-2);animation:pop .2s ease-out}

/* ---------- Écran de départ ---------- */
#setup{max-width:760px;margin:0 auto;padding-block:36px 52px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(48px,13vw,84px);line-height:.9;letter-spacing:-.04em;margin:0}
.hero h1 .a{color:var(--p1)} .hero h1 .b{color:var(--p2)}
.hero p{max-width:50ch;color:var(--muted);font-size:16.5px;margin:16px 0 0}
.seg{display:inline-flex;border-radius:14px;padding:4px;background:var(--surface);box-shadow:var(--sh-1);margin-top:26px}
.seg button{border:0;background:none;padding:9px 20px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:16px}
.pform{background:var(--surface);border-radius:20px;box-shadow:var(--sh-1);padding:16px;display:grid;gap:12px;min-width:0;border-top:4px solid var(--c)}
.phead{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:18px}
.link{margin-left:auto;background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;font-family:var(--body)}
.go{margin-top:20px;width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(160deg,var(--p1),var(--p1-2));color:#fff;font-family:var(--display);font-weight:800;font-size:19px;box-shadow:0 14px 30px -16px var(--p1)}
.perks{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 0;padding:0;list-style:none}
.perks li{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--surface);box-shadow:var(--sh-1);color:var(--ink-2)}


/* ---------- Fiche profil ---------- */
.pcard{background:var(--surface);border-radius:22px;box-shadow:var(--sh-1);overflow:hidden;margin-top:14px}
.pcard-h{display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(115deg,color-mix(in srgb,var(--pc) 22%,var(--surface)) 0%,color-mix(in srgb,var(--pc) 8%,var(--surface)) 55%,var(--surface) 100%)}
.pcard-av{width:80px;height:80px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--pc)}
.pcard-av>*,.pcard-av svg{width:100%;height:100%;display:block}
.pcard-av .pet{font-size:40px}
.pcard-t{min-width:0}
.pcard-h .rl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--pc)}
.pcard-h .nm{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.pcard-h .sb{font-size:12.5px;color:var(--muted);margin-top:3px}
.pcard-b{padding:6px 0 14px}
.pcard-k{text-align:center;font-family:var(--display);font-weight:800;font-size:17px;margin:8px 0 8px}
.ptab{margin:0 14px;border-radius:14px;overflow:hidden}
.ptab div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px;padding:9px 12px;font-size:14px}
.ptab div:nth-child(odd){background:var(--surface-2)}
.ptab dt{margin:0;font-weight:800;color:var(--ink-2)}
.ptab dd{margin:0;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.pbars{display:grid;gap:10px;padding:16px 16px 4px}
.pbar{display:grid;grid-template-columns:92px 1fr 40px;gap:10px;align-items:center;font-size:13px;font-weight:800;color:var(--ink-2)}
.pbar span:first-child{text-align:right}
.pbar .bar{grid-column:auto;height:12px;border-radius:7px}
.pbar em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.bar.v i{background:#8B6AD8} .bar.g i{background:#E2A72E}

/* ---------- Tuiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{display:grid;gap:10px;align-content:start;text-align:left;background:var(--surface);border:0;border-radius:18px;box-shadow:var(--sh-1);padding:14px;min-width:0;min-height:116px}
.tile:hover:not(:disabled){background:var(--surface-2)}
.tile:disabled{opacity:.45;cursor:default}
.tile .ic{width:42px;height:42px;border-radius:14px;font-size:20px}
.tile b{display:block;font-weight:800;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.tile small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:3px;overflow-wrap:anywhere}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="setup" class="gut" hidden></div>

<div id="app" class="gut" hidden>
  <header class="top">
    <div class="brand">Double <span>Vie</span></div>
    <div id="players" class="players"></div>
    <button id="menuBtn" class="icon-btn" type="button">Menu</button>
  </header>
  <section id="idcard" class="idcard"></section>
  <main id="log" class="log" aria-live="polite"></main>
  <section id="stats" class="stats"></section>
  <nav class="tabs">
    <button class="tab" id="tWork" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span id="tWorkL">Métier</span></button>
    <button class="tab" id="tAssets" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Biens</span></button>
    <button class="age" id="ageBtn" type="button" aria-label="Vieillir d’un an"><b>+</b>Âge</button>
    <button class="tab" id="tRel" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg><span>Relations</span></button>
    <button class="tab" id="tAct" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Activités</span></button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <div class="ph gut">
      <button id="pback" class="icon-btn" type="button" hidden>Retour</button>
      <h2 id="ptitle"></h2>
      <button id="pclose" class="icon-btn" type="button">Fermer</button>
    </div>
    <div id="pbody" class="pb gut"></div>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div id="mbox" class="mbox" role="alertdialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mhead"><span id="micon" hidden></span><h3 id="mtitle"></h3></div>
    <div id="mtext" class="mtext"></div>
    <div id="mch" class="mch"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
</html>
