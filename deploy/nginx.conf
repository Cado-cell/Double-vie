# Double Vie — nginx configuration for the static PWA.
# TLS is terminated by Traefik (Dokploy); this container only speaks HTTP on port 80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Used by the container health check (not logged).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker must always be revalidated so that updates reach the players.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # Icons rarely change.
    location ~* \.(png|ico|svg)$ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html and app.js: always revalidate (ETag => cheap 304 when nothing changed).
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
